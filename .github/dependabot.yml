# Dependabot configuration.
#
# GROUPING (added 2026-08-23, KI-3867). Without groups Dependabot opens one PR per
# package PER DIRECTORY, which is how this repo accumulated axios x3, pyjwt x2,
# brace-expansion x2, postcss x4 and react-router x2 as separate PRs — each needing
# its own approval under the `main` ruleset, and each going DIRTY whenever a sibling
# merged first. Grouping collapses them into one reviewable PR per family.
#
# The grouping mirrors shop-savvy-pos, which already had it and did not develop the
# same backlog. Runtime and tooling are deliberately separate groups: tooling can be
# auto-merged on green CI (see .github/workflows/dependabot-automerge.yml), runtime
# should be looked at.
#
# Majors stay excluded from the minor/patch runtime groups and arrive as their own
# PRs, which is what you want — a major is a decision, not a chore.
version: 2
updates:
- package-ecosystem: pip
  directory: /swipesavvy-ai-agents
  schedule:
    interval: weekly
    day: monday
    time: 03:00
  open-pull-requests-limit: 10
  reviewers:
  - security-team
  labels:
  - dependencies
  - python
  allow:
  - dependency-type: direct
  - dependency-type: indirect
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(deps)
    prefix-development: chore(deps-dev)
  groups: &id001
    python-runtime:
      patterns:
      - '*'
      exclude-patterns:
      - pytest*
      - black
      - flake8
      - mypy
      - isort
      - ruff
      - coverage*
      update-types:
      - minor
      - patch
    python-tooling:
      patterns:
      - pytest*
      - black
      - flake8
      - mypy
      - isort
      - ruff
      - coverage*
- package-ecosystem: pip
  directory: /swipesavvy-admin-portal
  schedule:
    interval: weekly
    day: monday
    time: 03:15
  open-pull-requests-limit: 10
  reviewers:
  - security-team
  labels:
  - dependencies
  - python
  groups: *id001
- package-ecosystem: npm
  directory: /swipesavvy-customer-website-nextjs
  schedule:
    interval: weekly
    day: monday
    time: 03:30
  open-pull-requests-limit: 10
  reviewers:
  - security-team
  labels:
  - dependencies
  - npm
  groups: &id002
    js-runtime:
      patterns:
      - '*'
      exclude-patterns:
      - '@types/*'
      - eslint*
      - '@typescript-eslint/*'
      - prettier*
      - vite
      - vitest
      - msw
      - '@testing-library/*'
      - jest*
      - postcss
      - tailwindcss
      update-types:
      - minor
      - patch
    js-tooling:
      patterns:
      - '@types/*'
      - eslint*
      - '@typescript-eslint/*'
      - prettier*
      - vite
      - vitest
      - msw
      - '@testing-library/*'
      - jest*
      - postcss
      - tailwindcss
- package-ecosystem: npm
  directory: /swipesavvy-wallet-web
  schedule:
    interval: weekly
    day: monday
    time: 03:45
  open-pull-requests-limit: 10
  reviewers:
  - security-team
  labels:
  - dependencies
  - npm
  groups: *id002
- package-ecosystem: npm
  directory: /swipesavvy-mobile-app-v2
  schedule:
    interval: weekly
    day: monday
    time: 04:00
  open-pull-requests-limit: 10
  reviewers:
  - security-team
  labels:
  - dependencies
  - npm
  groups: *id002
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 04:15
  open-pull-requests-limit: 10
  reviewers:
  - security-team
  labels:
  - dependencies
  - github-actions
  groups:
    gha:
      patterns:
      - '*'
