name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Python security scanning with Bandit
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./swipesavvy-ai-agents
    
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      
      - name: Install security scanning tools
        run: |
          # safety 3.x returns exit 64 without an API key; using pip-audit (OSS, no auth) instead.
          pip install bandit pip-audit

      - name: Run Bandit security scan
        # -ll = medium+ severity; -ii = medium+ confidence; --exit-zero = report-only.
        # Findings show up in the artifact below for triage without blocking every commit.
        run: |
          bandit -r app services -f json -o bandit-report.json -ll -ii --exit-zero
          bandit -r app services -ll -ii --exit-zero | head -40

      - name: Run pip-audit vulnerability check
        run: |
          python -m pip_audit -r requirements-pinned.txt --format json -o pip-audit-report.json || true
          python -m pip_audit -r requirements-pinned.txt | head -40 || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: bandit-report
          path: swipesavvy-ai-agents/bandit-report.json

      - name: Upload pip-audit results
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: pip-audit-report
          path: swipesavvy-ai-agents/pip-audit-report.json

  # Detect secrets with detect-secrets
  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./swipesavvy-ai-agents
    
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Full history for scanning
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      
      - name: Install detect-secrets
        run: pip install detect-secrets
      
      - name: Scan for secrets
        run: |
          detect-secrets scan --all-files --force-use-all-plugins \
            --baseline .secrets.baseline \
            app services tests || echo "Scan completed"
      
      - name: Audit secrets
        run: detect-secrets audit .secrets.baseline || true

  # Dependency vulnerability scanning
  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./swipesavvy-ai-agents
    
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      
      - name: Generate dependencies report
        run: pip freeze > requirements-lock.txt
      
      - name: Check dependencies with pip-audit
        run: |
          # safety check requires an API key in 3.x; pip-audit is the OSS replacement.
          # The pinned-deps file in this repo is requirements-pinned.txt (not requirements-lock.txt).
          pip install pip-audit
          python -m pip_audit -r requirements-pinned.txt --format json -o dependency-report.json || true
      
      - name: Upload dependency report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: dependency-report
          path: swipesavvy-ai-agents/dependency-report.json

  # Code quality with Pylint
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./swipesavvy-ai-agents
    
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint
      
      - name: Run Pylint
        run: |
          pylint app services --exit-zero \
            --output-format=json > pylint-report.json || true
      
      - name: Upload Pylint results
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: pylint-report
          path: swipesavvy-ai-agents/pylint-report.json

  # Configuration validation
  config-validation:
    name: Configuration Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./swipesavvy-ai-agents
    
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      
      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          # Match literal-string assignments only: password = "literal" / PASSWORD: "literal"
          # Excludes env-var reads, function calls, f-strings, hashing utilities, URL paths.
          if grep -rnE "^[[:space:]]*[A-Za-z_]*[Pp]assword[A-Za-z_]*[[:space:]]*=[[:space:]]*[\"'][^\"'$\\\\{][^\"']*[\"']" --include="*.py" app services \
              | grep -vE "password_hash|get_password_hash|os\.getenv|os\.environ|getenv\(|getattr\(|settings\.|config\.|self\.|cls\.|return |\.encode|\.decode|\bf['\"]|@"; then
            echo "❌ ERROR: Hardcoded passwords detected!"
            exit 1
          fi
          echo "✅ No hardcoded passwords found"
      
      - name: Check JWT configuration
        run: |
          echo "Checking JWT configuration..."
          # Match literal-string ASSIGNMENT of JWT_SECRET_KEY only (not comparisons or env reads).
          # JWT_SECRET_KEY = "literal" but NOT JWT_SECRET_KEY == "...", JWT_SECRET_KEY: str, etc.
          if grep -rnE "^[[:space:]]*JWT_SECRET_KEY[[:space:]]*=[[:space:]]*[\"'][^\"']+[\"']" --include="*.py" app \
              | grep -vE "os\.getenv|os\.environ|getenv\(|getattr\(|settings\.|self\.|cls\.|Field\(|: str"; then
            echo "❌ ERROR: Hardcoded JWT_SECRET_KEY found!"
            exit 1
          fi
          echo "✅ JWT configuration is secure"
      
      - name: Check environment files
        run: |
          echo "Verifying .env files..."
          [ -f .env.example ] && echo "✅ .env.example exists" || echo "⚠️ .env.example missing"
          [ -f .env.staging ] && echo "✅ .env.staging exists" || echo "⚠️ .env.staging missing"
          [ -f .env.production ] && echo "✅ .env.production exists" || echo "⚠️ .env.production missing"

      # KI-3893 / KI-3887 — two Dependabot config failure modes that are INVISIBLE
      # to every ordinary check, including `yaml.safe_load` and GitHub's own
      # "Dependabot config file validation":
      #
      #  1. An unquoted `time: 03:00`. Dependabot parses YAML 1.1 with Ruby, which
      #     reads that as the SEXAGESIMAL INTEGER 180, and the schema wants a
      #     string. PyYAML only applies sexagesimal WITHOUT a leading zero, so it
      #     returns the string "03:00" and every local validation passes while
      #     Dependabot reports a type error and stops raising ANY PR for the repo.
      #     This must be checked on the RAW TEXT — a YAML-parsing check cannot see it.
      #
      #  2. A `directory:` that contains no manifest. Dependabot does not error on
      #     this; the entry silently does nothing. Three of six entries pointed at
      #     paths with no package.json / requirements.txt (one was an orphaned,
      #     empty git submodule), while the root package.json, the root
      #     requirements.txt and swipesavvy-admin-portal's package.json — 103
      #     packages in total — had no coverage at all.
      - name: Validate Dependabot config (KI-3893 / KI-3887)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CFG=.github/dependabot.yml
          fail=0

          # (1) raw-text check: schedule.time must be quoted
          if grep -nE '^[[:space:]]*time:[[:space:]]*[0-9]{1,2}:[0-9]{2}[[:space:]]*$' "$CFG"; then
            echo "::error::Unquoted schedule.time above. Dependabot's Ruby YAML 1.1 parser reads"
            echo "  time: 03:00   as the integer 180 and rejects the whole config, silently"
            echo "  stopping every update for this repo. Quote it:  time: \"03:00\""
            fail=1
          else
            echo "OK  every schedule.time is quoted"
          fi

          # (2) every declared directory must actually contain a manifest.
          # This job runs setup-python, which shadows the runner's system python3
          # (that one ships PyYAML; a fresh setup-python interpreter does not), so
          # install it explicitly rather than relying on what happens to be there.
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os, re, sys, yaml
          cfg = yaml.safe_load(open('.github/dependabot.yml'))
          MANIFEST = {
              'npm': lambda d: os.path.exists(os.path.join(d, 'package.json')),
              'pip': lambda d: any(re.match(r'requirements.*\.txt$', f)
                                   for f in (os.listdir(d) if os.path.isdir(d) else [])),
              'github-actions': lambda d: os.path.isdir('.github/workflows'),
          }
          bad = []
          for u in cfg.get('updates', []):
              eco, raw = u['package-ecosystem'], u['directory']
              d = '.' + raw if raw != '/' else '.'
              check = MANIFEST.get(eco)
              if check and not check(d):
                  bad.append('%s %s' % (eco, raw))
          if bad:
              print('::error::Dependabot entries whose directory holds no manifest '
                    '(these do nothing, silently):')
              for b in bad:
                  print('  - ' + b)
              sys.exit(1)
          print('OK  all %d entries resolve to a real manifest' % len(cfg.get('updates', [])))
          PY

          [ "$fail" = "0" ]

  # Report summary
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [python-security, secrets-detection, dependency-check, code-quality, config-validation]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: security-reports
      
      - name: Generate security report
        run: |
          echo "# Security Scan Results" > security-report.md
          echo "" >> security-report.md
          echo "## Summary" >> security-report.md
          echo "- Python Security: ${{ needs.python-security.result }}" >> security-report.md
          echo "- Secrets Detection: ${{ needs.secrets-detection.result }}" >> security-report.md
          echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> security-report.md
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> security-report.md
          echo "- Config Validation: ${{ needs.config-validation.result }}" >> security-report.md
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
